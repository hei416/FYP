name: Deploy Frontend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/package.json'
      - 'frontend/server.js'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Azure login via service principal ────────────────────────
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── Install deps & build React ────────────────────────────────
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React app
        working-directory: frontend
        env:
          REACT_APP_API_BASE: https://codetutor-fyp-hei.azurewebsites.net
          CI: false
        run: npm run build

      # ── Install only express (runtime dep) into a clean node_modules ──
      - name: Install production server deps only
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm install express --no-save
          echo "node_modules size: $(du -sh node_modules | cut -f1)"

      # ── Disable Oryx (node_modules already bundled) ───────────────
      - name: Disable Oryx build
        run: |
          az webapp config appsettings set \
            --name codetutor-frontend-hei \
            --resource-group codetutor-rg \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false

      # ── Package frontend (build/ + server.js + package.json + node_modules) ─
      - name: Create deployment zip
        working-directory: frontend
        run: |
          zip -r ../frontend-deploy.zip build/ server.js package.json node_modules/
          echo "Zip size: $(du -sh ../frontend-deploy.zip | cut -f1)"

      # ── Deploy via Azure CLI ──────────────────────────────────────
      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --name codetutor-frontend-hei \
            --resource-group codetutor-rg \
            --src-path frontend-deploy.zip \
            --type zip \
            --async false
