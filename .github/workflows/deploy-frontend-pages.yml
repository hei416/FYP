# Deploy the CRA frontend to Cloudflare Pages (DEPLOY-1: static frontend).
# Trigger: manual (workflow_dispatch) ONLY — never push to main.
#
# Build-time config comes from repo VARIABLES (not hardcoded):
#   vars.REACT_APP_API_BASE — the deployed backend URL (CRA vars are build-time: changing
#                             it requires re-running this workflow, not an app setting)
#   vars.CF_PAGES_PROJECT   — the Cloudflare Pages project name
# Required SECRETS (names only; values live in GitHub secrets):
#   CLOUDFLARE_API_TOKEN (scoped: Account > Cloudflare Pages > Edit), CLOUDFLARE_ACCOUNT_ID
#
# REACT_APP_TERMINAL_WS stays deliberately UNSET while the terminal is off (FE-10 /
# readiness #11). Actions pinned to exact release tags.

name: Deploy frontend (Cloudflare Pages)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require build-time variables
        env:
          API_BASE: ${{ vars.REACT_APP_API_BASE }}
          CF_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          test -n "$API_BASE" || { echo "::error::repo variable REACT_APP_API_BASE is not set"; exit 1; }
          test -n "$CF_PROJECT" || { echo "::error::repo variable CF_PAGES_PROJECT is not set"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          REACT_APP_API_BASE: ${{ vars.REACT_APP_API_BASE }}
          # FE-12: CRA turns warnings into errors when CI=true; keep false until the
          # warning backlog is cleared, then flip to tighten the gate.
          CI: "false"
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        # wrangler pinned to major 3; pin the exact version at first real use.
        run: npx --yes wrangler@3 pages deploy build --project-name "$CF_PROJECT" --branch main
