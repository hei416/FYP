name: Deploy Backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'startup.sh'
      - 'routers/**'
      - 'services/**'
      - 'core/**'
      - 'vectorstore/**'
      - 'lessons_raw/**'
      - 'practical_tests/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Azure login via service principal ────────────────────────
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Package only backend files ───────────────────────────────
      - name: Create deployment zip
        run: |
          zip -r deploy.zip . \
            --exclude "*.db" \
            --exclude "*/__pycache__/*" \
            --exclude "*.pyc" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "frontend/*" \
            --exclude "venv/*" \
            --exclude ".venv/*" \
            --exclude ".idea/*" \
            --exclude ".vscode/*" \
            --exclude ".VSCodeCounter/*" \
            --exclude "deploy.zip" \
            --exclude "*.zip"
          echo "Zip size: $(du -sh deploy.zip | cut -f1)"

      # ── Deploy via Azure CLI (works reliably on Linux App Service) 
      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --name codetutor-fyp-hei \
            --resource-group codetutor-rg \
            --src-path deploy.zip \
            --type zip \
            --async false
