name: Deploy Backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      # PROVISIONAL (2026-10-22): adjusted for the backend/ restructure only.
      # Deploy method is undecided — revisit with the deploy-options decision.
      # terminal-service/** dropped 2026-10-23: the folder was deleted in the
      # single-process collapse (owner granted this CI edit in session).
      - 'backend/**'
      - 'startup.sh'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build local virtual environment
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Service
        run: |
          az webapp config set \
            --name codetutor-fyp-hei \
            --resource-group codetutor-rg \
            --startup-file startup.sh

          az webapp config appsettings set \
            --name codetutor-fyp-hei \
            --resource-group codetutor-rg \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false \
              WEBSITE_ENABLE_SYNC_UPDATE_SITE=false \
              WEBSITE_RUN_FROM_PACKAGE=0 \
              WEBSITE_CONTAINER_START_TIME_LIMIT=1800 \
              WEBSITES_CONTAINER_START_TIME_LIMIT=1800 \
              "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
              "SECRET_KEY=${{ secrets.SECRET_KEY }}"

      - name: Create deployment zip
        run: |
          chmod +x startup.sh

          zip -r deploy.zip . \
            --exclude "*.db" \
            --exclude "*/__pycache__/*" \
            --exclude "*.pyc" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "frontend/*" \
            --exclude "venv/*" \
            --exclude ".venv/*" \
            --exclude ".python_packages/*" \
            --exclude ".idea/*" \
            --exclude ".vscode/*" \
            --exclude ".VSCodeCounter/*" \
            --exclude "*.zip"

          echo "Zip size: $(du -sh deploy.zip | cut -f1)"

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --name codetutor-fyp-hei \
            --resource-group codetutor-rg \
            --src-path deploy.zip \
            --type zip

      - name: Poll health until ready
        run: |
          URL="https://codetutor-fyp-hei.azurewebsites.net/health"
          MAX_ATTEMPTS=60
          SLEEP_INTERVAL=10
          ATTEMPT=0

          echo "Polling $URL ..."
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Site is healthy!"
              exit 0
            fi

            sleep $SLEEP_INTERVAL
          done

          echo "Site did not respond with 200 in time."
          exit 1