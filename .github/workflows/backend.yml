name: Deploy Backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'startup.sh'
      - 'routers/**'
      - 'services/**'
      - 'core/**'
      - 'vectorstore/**'
      - 'lessons_raw/**'
      - 'practical_tests/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set startup file
        run: |
          az webapp config set \
            --name codetutor-fyp-hei \
            --resource-group codetutor-rg \
            --startup-file startup.sh

      - name: Enable Oryx build
        run: |
          az webapp config appsettings set \
            --name codetutor-fyp-hei \
            --resource-group codetutor-rg \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true \
              SCM_NO_BUILD_CACHE=true \
              WEBSITE_CONTAINER_START_TIME_LIMIT=1800 \
            "DATABASE_URL=${{ secrets.DATABASE_URL }}"

      - name: Create deployment zip
        run: |
          # Remove stale local packages before zipping — these conflict with Oryx's antenv
          rm -rf .python_packages

          zip -r deploy.zip . \
            --exclude "*.db" \
            --exclude "*/__pycache__/*" \
            --exclude "*.pyc" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "frontend/*" \
            --exclude "venv/*" \
            --exclude ".venv/*" \
            --exclude ".python_packages/*" \
            --exclude ".idea/*" \
            --exclude ".vscode/*" \
            --exclude ".VSCodeCounter/*" \
            --exclude "*.zip"
          echo "Zip size: $(du -sh deploy.zip | cut -f1)"

      - name: Wait before deployment
        run: sleep 30

      - name: Deploy to Azure Web App
        continue-on-error: true
        run: |
          az webapp deploy \
            --name codetutor-fyp-hei \
            --resource-group codetutor-rg \
            --src-path deploy.zip \
            --type zip \
            --async true
          echo "Deployment zip uploaded — Oryx build running on Azure server."

      - name: Wait for build then poll health
        run: |
          echo "Waiting 3 min for Oryx server-side build to complete..."
          sleep 180
          echo "Polling https://codetutor-fyp-hei.azurewebsites.net/health ..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://codetutor-fyp-hei.azurewebsites.net/health || echo "000")
            echo "  Attempt $i/30 — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Site is healthy!"
              exit 0
            fi
            sleep 20
          done
          echo "❌ Site did not respond with 200 within ~13 minutes."
          exit 1
