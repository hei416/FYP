# Local DEVELOPMENT stack (hot reload). Two containers so the React dev server
# can rebuild on save — a deployed instance is a SINGLE process (gunicorn
# serving both the API and frontend/build; see docs/OPS.md § Single-process).
#
#   docker compose up
#
# Container-image smoke test: docker-compose.container.yml (separate concern).

services:
  backend:
    image: python:3.11-slim
    container_name: codetutor-backend
    working_dir: /app/backend
    volumes:
      - ./:/app:cached
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      # API-only in this stack: the CRA container below serves the SPA, so the
      # backend must not pick up a stale frontend/build left over from a
      # `npm run build`.
      - FRONTEND_BUILD_DIR=/nonexistent
    ports:
      - "8000:8000"
    command: >-
      bash -lc "pip install -r requirements.txt &&
                uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:18
    container_name: codetutor-frontend
    # working_dir is already the frontend — do NOT `cd frontend` in the command
    # as well, or it resolves to /app/frontend/frontend (the pre-2026-10-23 bug).
    working_dir: /app/frontend
    volumes:
      - ./:/app:cached
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Without this the browser cannot reach the backend container.
      - REACT_APP_API_BASE=http://localhost:8000
    depends_on:
      - backend
    command: bash -lc "npm install && npm start"
